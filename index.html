<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yunic Hospitality — Coming Soon</title>
<meta name="description" content="Yunic Hospitality — Indonesian food culture, shared with the world. Based in Bali. Coming soon.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f0e8;
  --dark:     #1a3a32;
  --spice:    #b5763a;
  --green:    #2d5a4e;
  --muted:    #7a7a72;
  --text:     #1c1c1c;
  --serif:    'Playfair Display', Georgia, serif;
  --sans:     'Lato', system-ui, sans-serif;
}

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  text-align: center;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.35; transform: scaleY(0.7); }
  50%       { opacity: 1; transform: scaleY(1); }
}

.logo-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  margin-bottom: 3rem;
  animation: fadeUp 0.8s ease both;
}

.logo-line {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--spice), transparent);
  animation: pulse 2.5s ease-in-out infinite;
}

.logo-eyebrow {
  font-size: 0.62rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--spice);
  font-weight: 400;
}

.logo-name {
  font-family: var(--serif);
  font-size: clamp(2.8rem, 8vw, 5rem);
  font-weight: 400;
  color: var(--dark);
  line-height: 1.05;
  letter-spacing: -0.01em;
  animation: fadeUp 0.8s 0.1s ease both;
}

.logo-name em {
  font-style: italic;
  color: var(--green);
}

.logo-sub {
  font-size: 0.68rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.3rem;
  display: block;
  animation: fadeUp 0.8s 0.2s ease both;
}

.divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 2.5rem auto;
  width: 200px;
  animation: fadeUp 0.8s 0.3s ease both;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--spice);
  opacity: 0.3;
}
.divider-diamond {
  width: 6px; height: 6px;
  background: var(--spice);
  transform: rotate(45deg);
  flex-shrink: 0;
}

.tagline {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  color: var(--dark);
  font-weight: 400;
  line-height: 1.6;
  max-width: 42ch;
  margin: 0 auto 1.5rem;
  animation: fadeUp 0.8s 0.35s ease both;
}

.body-text {
  font-size: 0.95rem;
  color: var(--muted);
  max-width: 40ch;
  margin: 0 auto 3rem;
  line-height: 1.85;
  animation: fadeUp 0.8s 0.45s ease both;
}

.contact-link {
  display: inline-block;
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 400;
  color: var(--bg);
  background: var(--green);
  padding: 0.9rem 2.2rem;
  text-decoration: none;
  border-radius: 2px;
  transition: background 0.2s;
  animation: fadeUp 0.8s 0.55s ease both;
}
.contact-link:hover { background: var(--dark); }

.footer-mark {
  position: fixed;
  bottom: 2rem;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.5;
}

.footer-mark a {
  color: inherit;
  text-decoration: none;
}
.footer-mark a:hover { opacity: 1; color: var(--spice); }
</style>
</head>
<body>

<div class="logo-mark">
  <div class="logo-line"></div>
  <span class="logo-eyebrow">Bali, Indonesia</span>
</div>

<h1 class="logo-name">Yunic<br><em>Hospitality</em></h1>
<span class="logo-sub">Something is coming</span>

<div class="divider"><div class="divider-diamond"></div></div>

<p class="tagline">
  Indonesian food culture,<br>shared with the world.
</p>

<p class="body-text">
  We are putting the finishing touches on something we are proud of. In the meantime, get in touch — we are already open for enquiries.
</p>

<a href="mailto:hello@yunichospitality.com" class="contact-link">
  Get in Touch
</a>

<div class="footer-mark">
  <a href="https://yunicdining.com" target="_blank">yunicdining.com</a>
  &nbsp;·&nbsp;
  <a href="https://yunicshop.com" target="_blank">yunicshop.com</a>
</div>

</body>
</html>
