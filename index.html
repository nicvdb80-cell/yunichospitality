<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yunic Hospitality — Coming Soon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #F5F0E6;
  color: #0A0A08;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}
.logo-img {
  width: 90px;
  height: auto;
  margin-bottom: 2rem;
}
h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 300;
  letter-spacing: 0.04em;
  color: #0A0A08;
  margin-bottom: 0.5rem;
}
h1 em {
  font-style: italic;
  color: #A3704C;
}
.sub {
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #A3704C;
  margin-bottom: 2.5rem;
}
p {
  font-size: 0.95rem;
  color: #6B6860;
  max-width: 42ch;
  line-height: 1.85;
  font-weight: 300;
  margin-bottom: 2.5rem;
}
.divider {
  width: 40px;
  height: 1px;
  background: #A3704C;
  margin: 0 auto 2.5rem;
  opacity: 0.4;
}
.contact {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1rem;
  color: #0A0A08;
}
.contact a {
  color: #A3704C;
  text-decoration: none;
}
.contact a:hover { text-decoration: underline; }
.footer {
  position: absolute;
  bottom: 2rem;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #C0B8B0;
}
</style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/nicvdb80-cell/yunichospitality/main/images/yunic-logo.png"
       alt="Yunic Hospitality" class="logo-img">
  <h1>Yunic <em>Hospitality</em></h1>
  <p class="sub">Bali, Indonesia</p>
  <div class="divider"></div>
  <p>We are working on something. Back soon.</p>
  <p class="contact">
    In the meantime, reach us at<br>
    <a href="mailto:yunicdining@gmail.com">yunicdining@gmail.com</a>
  </p>
  <div class="footer">© 2026 Yunic Hospitality</div>
</body>
</html>
