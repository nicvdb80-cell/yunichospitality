<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yunic Hospitality</title>
<meta name="description" content="Yunic Hospitality — private chefs and culinary experiences by Fryana Yuli Azhar and Chef Nic Vanderbeeken. Coming soon.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://yunichospitality.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #F6F4EF;
  color: #344147;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8vw;
  text-align: center;
}
.mark {
  font-family: 'Cormorant SC', serif;
  font-weight: 400;
  font-size: clamp(40px, 8vw, 72px);
  letter-spacing: 0.22em;
  color: #1F2C32;
  margin-bottom: 28px;
}
.rule {
  width: 64px;
  height: 1px;
  background: #A48760;
  margin: 0 auto 40px;
}
.tagline {
  font-size: clamp(16px, 2.2vw, 20px);
  font-weight: 300;
  line-height: 1.6;
  color: #6B7A82;
  max-width: 34ch;
  margin: 0 auto;
}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="mark">YUNIC</div>
    <div class="rule"></div>
    <p class="tagline">We have been quietly building something we truly believe in.</p>
  </div>
</div>

</body>
