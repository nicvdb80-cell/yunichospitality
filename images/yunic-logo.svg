<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6B3D0A"/>
      <stop offset="18%"  stop-color="#B8780E"/>
      <stop offset="32%"  stop-color="#D4A020"/>
      <stop offset="44%"  stop-color="#ECC84A"/>
      <stop offset="52%"  stop-color="#FAE88A"/>
      <stop offset="60%"  stop-color="#ECC84A"/>
      <stop offset="74%"  stop-color="#C89018"/>
      <stop offset="88%"  stop-color="#9A6010"/>
      <stop offset="100%" stop-color="#6B3D0A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7A4A0C"/>
      <stop offset="20%"  stop-color="#C89018"/>
      <stop offset="38%"  stop-color="#ECC84A"/>
      <stop offset="50%"  stop-color="#FAF0B0"/>
      <stop offset="62%"  stop-color="#ECC84A"/>
      <stop offset="80%"  stop-color="#C08010"/>
      <stop offset="100%" stop-color="#7A4A0C"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7A4A0C"/>
      <stop offset="25%"  stop-color="#D4A020"/>
      <stop offset="50%"  stop-color="#FAF0B0"/>
      <stop offset="75%"  stop-color="#D4A020"/>
      <stop offset="100%" stop-color="#7A4A0C"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════
       OUTER CIRCLE — thick bold ring
  ══════════════════════════════════ -->
  <circle cx="250" cy="230" r="195" stroke="url(#g1)" stroke-width="14" fill="none"/>
  <circle cx="250" cy="230" r="178" stroke="url(#g1)" stroke-width="3"  fill="none" opacity="0.4"/>

  <!-- ══════════════════════════════════
       CLOCHE AT TOP — serving dish lid
  ══════════════════════════════════ -->
  <!-- Steam lines -->
  <path d="M232 32 Q226 18 232 6"  stroke="url(#g1)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M250 28 Q244 14 250 2"  stroke="url(#g1)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M268 32 Q274 18 268 6"  stroke="url(#g1)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Dome -->
  <path d="M190 92 Q250 46 310 92" stroke="url(#g1)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Base plate -->
  <path d="M175 100 L325 100"      stroke="url(#g1)" stroke-width="9"  stroke-linecap="round" fill="none"/>
  <!-- Knob -->
  <ellipse cx="250" cy="55" rx="14" ry="9" fill="url(#g1)"/>

  <!-- ══════════════════════════════════
       Y LETTERFORM — bold strokes
       Left arm: top-left → centre-join
       Right arm: top-right → centre-join
       Stem: centre-join → bottom
  ══════════════════════════════════ -->
  <!-- Left arm of Y -->
  <path d="M108 118 Q148 168 170 210" stroke="url(#g1)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <!-- Right arm of Y -->
  <path d="M392 118 Q352 168 330 210" stroke="url(#g1)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <!-- Y stem down -->
  <path d="M170 210 Q210 228 250 222 Q290 228 330 210 L330 348" stroke="url(#g1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M170 210 L170 348" stroke="url(#g1)" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Inner cross-hatching on Y arms (decorative diagonals from original) -->
  <line x1="120" y1="136" x2="180" y2="186" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <line x1="138" y1="118" x2="200" y2="168" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <line x1="380" y1="136" x2="320" y2="186" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <line x1="362" y1="118" x2="300" y2="168" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- ══════════════════════════════════
       FLAME — left side inside circle
  ══════════════════════════════════ -->
  <path d="
    M138 355
    Q118 318 128 278
    Q134 252 122 225
    Q148 250 145 278
    Q162 248 156 210
    Q185 242 176 290
    Q190 265 200 248
    Q196 292 174 332
    Q162 358 138 355 Z"
    fill="url(#g2)"/>

  <!-- ══════════════════════════════════
       FORK — right side inside circle
  ══════════════════════════════════ -->
  <!-- 4 tines -->
  <rect x="288" y="192" width="7" height="52" rx="3.5" fill="url(#g2)"/>
  <rect x="302" y="192" width="7" height="52" rx="3.5" fill="url(#g2)"/>
  <rect x="316" y="192" width="7" height="52" rx="3.5" fill="url(#g2)"/>
  <rect x="330" y="192" width="7" height="52" rx="3.5" fill="url(#g2)"/>
  <!-- Fork neck curve -->
  <path d="M288 244 Q312 260 344 244" stroke="url(#g2)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Fork handle -->
  <rect x="305" y="258" width="14" height="92" rx="7" fill="url(#g2)"/>

  <!-- ══════════════════════════════════
       KNIFE — beside fork
  ══════════════════════════════════ -->
  <rect x="352" y="192" width="12" height="158" rx="6" fill="url(#g2)" opacity="0.85"/>
  <!-- Blade tip -->
  <path d="M352 192 Q368 208 364 240 L352 240 Z" fill="url(#g2)"/>

  <!-- ══════════════════════════════════
       YUNIC — bold serif wordmark
       Each letter drawn as thick strokes
  ══════════════════════════════════ -->
  <!-- Letterform stroke-width = 18, caps height ~90px -->

  <!-- Y -->
  <path d="M22 450 L68 500 L114 450" stroke="url(#g3)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="500" x2="68" y2="548" stroke="url(#g3)" stroke-width="18" stroke-linecap="round"/>

  <!-- U -->
  <path d="M128 450 L128 516 Q128 550 160 550 Q192 550 192 516 L192 450" stroke="url(#g3)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- N -->
  <line x1="208" y1="548" x2="208" y2="450" stroke="url(#g3)" stroke-width="18" stroke-linecap="round"/>
  <path d="M208 450 L264 548" stroke="url(#g3)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <line x1="264" y1="548" x2="264" y2="450" stroke="url(#g3)" stroke-width="18" stroke-linecap="round"/>

  <!-- I -->
  <line x1="286" y1="450" x2="286" y2="548" stroke="url(#g3)" stroke-width="18" stroke-linecap="round"/>
  <!-- Serifs on I -->
  <line x1="272" y1="450" x2="300" y2="450" stroke="url(#g3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="272" y1="548" x2="300" y2="548" stroke="url(#g3)" stroke-width="10" stroke-linecap="round"/>

  <!-- C -->
  <path d="M478 468 Q460 448 432 448 Q392 448 384 499 Q376 550 410 556 Q438 560 464 540" stroke="url(#g3)" stroke-width="18" fill="none" stroke-linecap="round"/>

</svg>
